name: Unified Odoo Release Automation

on:
  push:
    branches:
      - master  # Adjust to 'main' if that is your primary branch name
    paths:
      - '**/__manifest__.py'  # Triggers only when your semantic version changes

jobs:
  merge_prefix_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls full git history and all branches

      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

      - name: Process Odoo Releases
        run: |
          ODOO_BRANCHES=("17.0" "18.0" "19.0")
          MASTER_SHA=$(git rev-parse HEAD)
          echo "Source master commit to merge: $MASTER_SHA"

          for branch in "${ODOO_BRANCHES[@]}"; do
            echo "========================================"
            echo "🚀 STARTING PROCESSING FOR ODOO $branch"
            echo "========================================"
            
            # 1. Switch directly to the release branch
            git checkout "$branch"
            git pull origin "$branch"
            
            # 2. Merge master into the release branch (favoring master files)
            if ! git merge "$MASTER_SHA" -m "chore: merge master updates into $branch" -X theirs; then
              echo "❌ CONFLICT DETECTED on branch $branch! Skipping automation."
              git merge --abort
              continue
            fi
            
            # 3. Find and rewrite the version in the manifest file natively on this branch
            find . -name "__manifest__.py" | while read -r manifest; do
              echo "Fixing prefix for file: $manifest"
              python3 -c "
            import re
            with open('$manifest', 'r') as f:
                content = f.read()

            # Captures structural groups securely
            pattern = r\"(['\\\" ]version['\\\" ]\s*:\s*['\\\"])(?:\d+\.\d+\.)?(\d+\.\d+\.\d+)(['\\\"])\"

            # Uses \g<1> to safely separate the group index from numeric text
            updated_content = re.sub(pattern, r\"\g<1>$branch.\2\3\", content)

            with open('$manifest', 'w') as f:
                f.write(updated_content)
            "
            done
            
            # 4. Commit and push the manifest adjustments back to the branch
            if [[ -n "$(git status --porcelain)" ]]; then
              git add "**/__manifest__.py"
              git commit --amend --no-edit # Blends the modification directly into the merge commit cleanly
              echo "Pushing changes to origin/$branch..."
              git push origin HEAD:"$branch" --force-with-lease
            else
              echo "No manifest text changes needed, pushing baseline merge..."
              git push origin HEAD:"$branch"
            fi
            
            # 5. Extract the full prefixed version string and create the Git tag
            MANIFEST_FILE=$(find . -name "__manifest__.py" | head -n 1)
            FULL_VERSION=$(grep -E "['\"]version['\"]" "$MANIFEST_FILE" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+")
            echo "Resolved runtime version string: v$FULL_VERSION"
            
            if ! git rev-parse "v$FULL_VERSION" >/dev/null 2>&1; then
              echo "Creating and pushing git tag v$FULL_VERSION..."
              git tag -a "v$FULL_VERSION" -m "Automated release v$FULL_VERSION for Odoo $branch"
              git push origin "v$FULL_VERSION"
            else
              echo "Tag v$FULL_VERSION already exists on remote server. Skipping."
            fi
            
          done

